SchemaVersion: "1.0"
PackageIdentifier: Contoso.Tool
PackageName: Contoso Tool
Publisher: Contoso Ltd.
Description: Internal tool for Contoso employees.
PackageVersion: 1.2.3
AssignmentSync: merge

Apps:
  - Platform: windows
    Architecture: x64
    InstallerType: win32
    DisplayName: Contoso Tool [Windows x64]

    Package:
      IntuneWin:
        SetupFile: install.ps1

      RepositoryFiles:
        - Source: scripts/windows/x64/install.ps1
          Destination: install.ps1
        - Source: scripts/windows/common/uninstall.ps1
          Destination: uninstall.ps1
        - Source: scripts/windows/common/detect.ps1
          Destination: detect.ps1

      # To pull an external binary, add an ExternalFiles entry like the one below
      # and replace the Url and Sha256 placeholders with real values.
      # ExternalFiles:
      #   - Type: publicHttp
      #     Url: https://example.com/downloads/contoso-tool-1.2.3-x64.exe
      #     Destination: bin/contoso-tool.exe
      #     Sha256: "<sha256>"

    Install:
      CommandLine: powershell.exe -ExecutionPolicy Bypass -File .\install.ps1
      UninstallCommandLine: powershell.exe -ExecutionPolicy Bypass -File .\uninstall.ps1
      InstallExperience: system
      RestartBehavior: suppress

    Detection:
      Type: script
      ScriptFile: scripts/windows/common/detect.ps1
      RunAs32Bit: false
      EnforceSignatureCheck: false

    Requirements:
      MinimumOSVersion: 10.0.19045
      Architecture: x64

    Assignments:
      - Target: group
        GroupId: "00000000-0000-0000-0000-000000000001"
        Intent: required

    # Optional. The exact set of Intune app categories this app should belong to. The categories must
    # already exist in the tenant (matched on displayName, case-insensitively); Relaypublisher never
    # creates, renames or deletes a category. Omitting the key preserves whatever the app is related to
    # today and makes no category Graph call; `Categories: []` removes every relationship.
    # See doc/01-manifest-schema.md section 5.8.
    # Categories:
    #   - Business Apps
    #   - Productivity
