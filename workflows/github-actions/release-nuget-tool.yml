# Reference sample for NuGet global tool release.
# Copy this file into .github/workflows/ and configure secrets before enabling it.
name: Release NuGet Tool

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and test
        run: |
          dotnet build IntuneLobPublisher.slnx --configuration Release
          dotnet test IntuneLobPublisher.slnx --configuration Release --no-build

      - name: Pack relaypublisher tool
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/IntuneLobPublisher.Cli/IntuneLobPublisher.Cli.csproj \
            --configuration Release \
            -p:ContinuousIntegrationBuild=true \
            -p:Version="$VERSION" \
            --output ./artifacts/nuget

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "relaypublisher v${VERSION}" \
            --draft \
            --generate-notes \
            ./artifacts/nuget/*.nupkg

      - name: Publish to nuget.org
        run: |
          dotnet nuget push ./artifacts/nuget/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --skip-duplicate

