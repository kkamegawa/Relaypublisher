# Reference sample for PR build and test validation against the main branch.
# Copy this file into .github/workflows/ to enable CI checks on pull requests.
name: CI

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build IntuneLobPublisher.slnx --configuration Release

      - name: Test
        run: dotnet test IntuneLobPublisher.slnx --configuration Release --no-build

      - name: Verify global tool pack
        shell: bash
        run: |
          dotnet pack src/IntuneLobPublisher.Cli/IntuneLobPublisher.Cli.csproj \
            --configuration Release \
            --no-build \
            -p:Version=0.0.0-ci \
            --output ./artifacts/nuget
