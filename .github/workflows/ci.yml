# Build, test and produce distributable artifacts for every pull request (any base branch, including
# the intermediate branches used by stacked PRs) and every push to main.
#
# This workflow must stay secret-free: the repository is intended to become public, and
# pull requests from forks receive neither secrets nor a writable GITHUB_TOKEN.
# Release publishing lives in release-draft.yml / release-publish.yml.
name: CI

on:
  pull_request:

  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI builds are never published; the real version comes from the release tag.
  CI_VERSION: 0.0.0-ci.${{ github.run_number }}

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # persist-credentials: false keeps the job token out of .git/config, where the
      # build code executed below could otherwise read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build IntuneLobPublisher.slnx --configuration Release

      - name: Test
        run: >
          dotnet test IntuneLobPublisher.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: ./test-results
          if-no-files-found: warn
          retention-days: 7

  package:
    name: pack global tool
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Also verifies that the CLI still packs as a NuGet global tool (PackAsTool).
      - name: Pack
        run: >
          dotnet pack src/IntuneLobPublisher.Cli/IntuneLobPublisher.Cli.csproj
          --configuration Release
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ env.CI_VERSION }}
          --output ./artifacts/nuget

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: ./artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 7

  single-file:
    name: single-file app (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, osx-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Single-file publish is not native AOT, so every RID cross-builds from a Linux runner.
      # PublishTrimmed stays false: YamlDotNet, FluentValidation and Azure.Identity rely on
      # reflection and break at run time when trimmed.
      - name: Publish self-contained single file
        run: >
          dotnet publish src/IntuneLobPublisher.Cli/IntuneLobPublisher.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ env.CI_VERSION }}
          --output ./artifacts/single-file/${{ matrix.rid }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relaypublisher-${{ matrix.rid }}
          path: ./artifacts/single-file/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 7