# Push the reviewed release artifacts to the NuGet feeds.
#
# Triggered when a human publishes the draft release that release-draft.yml created.
# The packages are downloaded from the release instead of being rebuilt, so the bits that
# were reviewed are exactly the bits that get published. A NuGet feed cannot un-publish a
# version (only unlist it), which is why the manual release publish is the gate.
#
# `release: published` fires for ANY release in this repository, so this workflow re-derives
# provenance itself: the tag must match vMAJOR.MINOR.PATCH, must be reachable from main, and
# the release must carry exactly the package built for that tag.
#
# Stable releases also open a pull request against the Homebrew tap. That job does not depend on
# the NuGet push, so neither can block the other, and a human merges the tap pull request after
# the tap's own CI has installed and run the formula.
name: Release (publish packages)

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # Read-only provenance gate. Nothing here can reach the publishing secrets, and the
  # privileged jobs below do not start unless every check passes.
  guard:
    name: verify release provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      package: ${{ steps.resolve.outputs.package }}
      stable: ${{ steps.resolve.outputs.stable }}
      mac-archive: ${{ steps.resolve.outputs.mac-archive }}
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - name: Validate the tag format
        id: resolve
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          if [ "$VERSION" = "$TAG_NAME" ]; then
            echo "::error::release ${TAG_NAME} is not a v-prefixed tag; refusing to publish."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::release ${TAG_NAME} is not a valid vMAJOR.MINOR.PATCH[-prerelease] tag; refusing to publish."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=relaypublisher.${VERSION}.nupkg" >> "$GITHUB_OUTPUT"
          echo "mac-archive=relaypublisher-${VERSION}-osx-arm64.zip" >> "$GITHUB_OUTPUT"
          # Prereleases go to the NuGet feeds but never to the Homebrew tap.
          case "$VERSION" in
            *-*) echo "stable=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "stable=true" >> "$GITHUB_OUTPUT" ;;
          esac

      # Only releases cut from main may publish. "behind" means main already contains the
      # tagged commit; "identical" means it is main's tip.
      - name: Verify the tagged commit is reachable from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.sha')"
          TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.type')"
          if [ "$TYPE" = "tag" ]; then
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}" --jq '.object.sha')"
          fi
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${SHA}" --jq '.status')"
          case "$STATUS" in
            behind|identical) echo "release ${TAG_NAME} (${SHA}) is reachable from main ($STATUS)" ;;
            *)
              echo "::error::release ${TAG_NAME} is not reachable from main (compare status: $STATUS)"
              exit 1
              ;;
          esac

      # release-draft.yml attaches exactly one .nupkg. Anything else means the release was
      # not produced by that workflow, or extra assets were added after the fact.
      - name: Verify the release carries exactly the expected package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED: ${{ steps.resolve.outputs.package }}
        run: |
          set -euo pipefail
          ASSETS="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" --jq '.assets[].name | select(endswith(".nupkg"))')"
          if [ "$ASSETS" != "$EXPECTED" ]; then
            echo "::error::expected exactly one package asset named ${EXPECTED}, found:"
            printf '%s\n' "$ASSETS"
            exit 1
          fi

  push-packages:
    name: push to GitHub Packages, Azure Artifacts and nuget.org
    runs-on: ubuntu-latest
    needs: guard
    # Scope the publishing secrets (and optionally required reviewers) to this environment.
    environment: release
    permissions:
      contents: read # gh release download
      packages: write # GitHub Packages
      id-token: write # Azure workload identity federation and NuGet Trusted Publishing
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
      PACKAGE: ${{ needs.guard.outputs.package }}
    steps:
      # Only global.json is needed here; keep the privileged token out of .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Download by exact name, not by wildcard, so only the package the guard job
      # verified can reach the feeds.
      - name: Download the released package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ./artifacts/nuget
          gh release download "$TAG_NAME" --pattern "$PACKAGE" --dir ./artifacts/nuget
          test -f "./artifacts/nuget/${PACKAGE}"
          ls -l ./artifacts/nuget

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "./artifacts/nuget/${{ env.PACKAGE }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - name: Sign in to Azure with workload identity federation
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_ARTIFACTS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_ARTIFACTS_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_ARTIFACTS_SUBSCRIPTION_ID }}

      # Installed as a version-pinned, signed NuGet package rather than by piping a script
      # from a mutable aka.ms redirect into a shell: this job holds the publishing secrets
      # and an Azure token, so the install must not be a moving target.
      - name: Install the Azure Artifacts credential provider
        run: >
          dotnet tool install --global Microsoft.Artifacts.CredentialProvider.NuGet.Tool
          --version 2.0.4
          --source https://api.nuget.org/v3/index.json

      - name: Acquire an Azure DevOps token for the credential provider
        run: |
          set -euo pipefail
          # 499b84ac-1321-427f-aa17-267ca6975798 is the fixed Azure DevOps resource id.
          TOKEN="$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken -o tsv)"
          echo "::add-mask::$TOKEN"
          echo "VSS_NUGET_ACCESSTOKEN=$TOKEN" >> "$GITHUB_ENV"
          # The feed URL is a secret, so derive the organization prefix here and mask it too.
          FEED='${{ secrets.AZURE_ARTIFACTS_FEED_URL }}'
          PREFIX="$(printf '%s' "$FEED" | sed -E 's#^(https://[^/]+/[^/]+)/.*#\1/#')"
          echo "::add-mask::$PREFIX"
          echo "VSS_NUGET_URI_PREFIXES=$PREFIX" >> "$GITHUB_ENV"

      - name: Push to Azure Artifacts
        run: >
          dotnet nuget push "./artifacts/nuget/${{ env.PACKAGE }}"
          --api-key AzureDevOps
          --source '${{ secrets.AZURE_ARTIFACTS_FEED_URL }}'
          --skip-duplicate

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key immediately
      # before publishing. The action masks its output; no long-lived API key is stored.
      - name: Sign in to nuget.org with Trusted Publishing
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_TEMP_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "./artifacts/nuget/${{ env.PACKAGE }}"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_TEMP_API_KEY"
          --skip-duplicate

  # Opens (or refreshes) a pull request that points the Homebrew tap formula at this release's
  # osx-arm64 archive. Deliberately not chained to push-packages: a tap failure must not block or
  # roll back the NuGet push, and a feed failure must not hold back the tap.
  update-homebrew-tap:
    name: open Homebrew tap pull request
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.stable == 'true'
    environment: release
    permissions:
      contents: read # gh release download
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
      VERSION: ${{ needs.guard.outputs.version }}
      MAC_ARCHIVE: ${{ needs.guard.outputs.mac-archive }}
      TAP_REPOSITORY: ${{ github.repository_owner }}/homebrew-tap
    steps:
      # Only tools/New-HomebrewFormula.ps1 is needed from this repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # release-draft.yml attaches exactly one macOS archive and one checksum file. Download both
      # by exact name so only the reviewed bits can reach the formula.
      - name: Download the released macOS archive and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAMES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" --jq '.assets[].name')"
          for NAME in "$MAC_ARCHIVE" SHA256SUMS.txt; do
            COUNT="$(printf '%s\n' "$NAMES" | grep -Fxc -- "$NAME" || true)"
            if [ "$COUNT" != "1" ]; then
              echo "::error::expected exactly one release asset named ${NAME}, found ${COUNT}"
              exit 1
            fi
          done
          mkdir -p ./artifacts/homebrew
          gh release download "$TAG_NAME" --pattern "$MAC_ARCHIVE" --dir ./artifacts/homebrew
          gh release download "$TAG_NAME" --pattern SHA256SUMS.txt --dir ./artifacts/homebrew
          ls -l ./artifacts/homebrew

      # The formula pins the hash from SHA256SUMS.txt, so make sure it really is the archive's hash.
      - name: Verify the archive against SHA256SUMS.txt
        working-directory: ./artifacts/homebrew
        run: |
          set -euo pipefail
          EXPECTED="$(awk -v name="$MAC_ARCHIVE" '{ file = $2; sub(/^\*/, "", file); sub(/^\.\//, "", file); if (file == name) print tolower($1) }' SHA256SUMS.txt)"
          if [ "$(printf '%s' "$EXPECTED" | grep -c '^')" != "1" ]; then
            echo "::error::SHA256SUMS.txt must list ${MAC_ARCHIVE} exactly once"
            exit 1
          fi
          ACTUAL="$(sha256sum "$MAC_ARCHIVE" | cut -d' ' -f1)"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::${MAC_ARCHIVE} hashes to ${ACTUAL}, but SHA256SUMS.txt records ${EXPECTED}"
            exit 1
          fi
          echo "${MAC_ARCHIVE} matches SHA256SUMS.txt (${ACTUAL})"

      - name: Render the formula
        shell: pwsh
        run: >
          ./tools/New-HomebrewFormula.ps1
          -Version $env:VERSION
          -Sha256SumsPath ./artifacts/homebrew/SHA256SUMS.txt
          -Repository $env:GITHUB_REPOSITORY
          -OutputPath ./artifacts/homebrew/relaypublisher.rb

      # A GitHub App installed only on the tap, scoped down again here, is the only credential
      # that can write to it. GITHUB_TOKEN cannot write to another repository, and pull requests
      # opened with it would not trigger the tap's CI.
      - name: Create a tap-scoped GitHub App token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      # The token is persisted for the push below; no code from either repository runs after this.
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ steps.tap-token.outputs.token }}
          path: tap
          fetch-depth: 0

      - name: Open or update the tap pull request
        working-directory: tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="relaypublisher-${VERSION}"
          DEFAULT_BRANCH="$(gh repo view "$TAP_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')"

          # Rebuild the branch from the default branch on every run so a rerun is idempotent.
          git switch -C "$BRANCH" "origin/${DEFAULT_BRANCH}"
          mkdir -p Formula
          cp ../artifacts/homebrew/relaypublisher.rb Formula/relaypublisher.rb
          git add Formula/relaypublisher.rb
          if git diff --cached --quiet; then
            echo "Formula/relaypublisher.rb on ${DEFAULT_BRANCH} already pins ${VERSION}; nothing to do."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "relaypublisher ${VERSION}"
          # The branch belongs to this job alone, so a rerun replaces it wholesale.
          git push --force origin "$BRANCH"

          PR_URL="$(gh pr list --repo "$TAP_REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$PR_URL" ]; then
            echo "Updated the existing pull request ${PR_URL}"
          else
            gh pr create --repo "$TAP_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "relaypublisher ${VERSION}" \
              --body "Updates the formula to ${GITHUB_REPOSITORY} release ${TAG_NAME} (${MAC_ARCHIVE}). Opened by the release-publish workflow; merge after the brew test-bot check passes."
          fi
