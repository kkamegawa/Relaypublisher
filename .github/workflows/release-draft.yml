# Build a release candidate from a `v*` tag and attach it to a DRAFT GitHub release.
#
# Nothing is pushed to any NuGet feed here. Publishing the draft release by hand is the
# review gate; release-publish.yml reacts to that and pushes the reviewed artifacts.
name: Release (draft)

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build IntuneLobPublisher.slnx --configuration Release

      - name: Test
        run: dotnet test IntuneLobPublisher.slnx --configuration Release --no-build

  draft-release:
    name: pack, publish binaries and draft the release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write # required to create the draft release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Releases are cut from main only. Reject a tag pushed onto any other history.
      - name: Verify the tag is reachable from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} is not reachable from main"
            exit 1
          fi

      # The tag is the single source of truth for the package version. Validate it before
      # it reaches MSBuild so a malformed tag fails loudly instead of producing a junk version.
      - name: Resolve version from tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag ${GITHUB_REF_NAME} is not a valid vMAJOR.MINOR.PATCH[-prerelease] tag"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          case "$VERSION" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - name: Pack global tool
        run: >
          dotnet pack src/IntuneLobPublisher.Cli/IntuneLobPublisher.Cli.csproj
          --configuration Release
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ env.VERSION }}
          --output ./artifacts/release

      # Single-file publish is not native AOT, so every RID cross-builds from a Linux runner.
      # PublishTrimmed stays false: YamlDotNet, FluentValidation and Azure.Identity rely on
      # reflection and break at run time when trimmed.
      - name: Publish self-contained single-file apps
        run: |
          set -euo pipefail
          for RID in win-x64 win-arm64 osx-arm64; do
            dotnet publish src/IntuneLobPublisher.Cli/IntuneLobPublisher.Cli.csproj \
              --configuration Release \
              --runtime "$RID" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:PublishTrimmed=false \
              -p:ContinuousIntegrationBuild=true \
              -p:Version="$VERSION" \
              --output "./artifacts/single-file/$RID"
            (cd "./artifacts/single-file/$RID" \
              && zip -qr "$GITHUB_WORKSPACE/artifacts/release/relaypublisher-${VERSION}-${RID}.zip" .)
          done

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd ./artifacts/release
          sha256sum ./*.nupkg ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Upsert so re-running the workflow for the same tag refreshes the assets
      # instead of failing on an existing draft.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./artifacts/release/* --clobber
          else
            ARGS=(--title "relaypublisher v${VERSION}" --draft --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then
              ARGS+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${ARGS[@]}" ./artifacts/release/*
          fi
          echo "Draft release created. Publish it manually to trigger the NuGet feed push."