# Fails when .github/workflows/actions.lock is out of sync with repository workflows or a locked
# pin can no longer be verified upstream. The consumer workflow sample is checked explicitly too.
name: verify-lockfile

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify .github/workflows workflows/github-actions/publish-intune-apps.yml
